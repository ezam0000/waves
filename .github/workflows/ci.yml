name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start virtual audio output
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=waves_test rate=48000
          pactl set-default-sink waves_test
          pactl info
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
